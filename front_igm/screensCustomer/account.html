<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu Ecommerce - Account</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        body {
            padding-top: 64px;
        }

        .account-card {
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        .info-label {
            font-size: 0.85rem;
            color: #64748b;
        }

        .associated-box {
            background: #f8fafc;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 12px;
            padding: 16px;
        }
    </style>
</head>

<body>

    <!-- NAV (igual que index) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html#top">TuEcom</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMain"
                aria-controls="navMain"
                aria-expanded="false"
                aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                    <h1 class="h3 fw-bold mb-4">Account</h1>

                    <div class="card shadow-sm account-card">
                        <div class="card-body p-4">

                            <!-- Nombre -->
                            <div class="mb-4">
                                <div class="info-label">Nombre</div>
                                <div class="fw-semibold">Juan</div>
                            </div>

                            <!-- Apellido -->
                            <div class="mb-4">
                                <div class="info-label">Apellido</div>
                                <div class="fw-semibold">Perez</div>
                            </div>

                            <!-- Account Associated -->
                            <div class="mb-4">
                                <div class="info-label mb-2">Account associated</div>

                                <div class="associated-box">
                                    <div class="fw-semibold">Mercado pago</div>
                                    <div class="small text-secondary">ID: shop_123456</div>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <a href="dshb.shops.html" class="btn btn-primary">
                                    Shops
                                </a>
                                <a href="payments.html" class="btn btn-outline-dark">
                                    Payments
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

        <script src="auth.js"></script>
</body>

</html>
