<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pago rechazado | TuEcom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body { background-color: #f8f9fa; }
    .card-soft { border: none; border-radius: 0.75rem; }
    .countdown { font-variant-numeric: tabular-nums; font-weight: 600; }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">TuEcom</a>
    </div>
  </nav>

  <main class="container" style="padding-top: 100px; padding-bottom: 60px;">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card card-soft shadow-sm">
          <div class="card-body text-center p-5">

            <div class="mb-3">
              <h1 class="h4 fw-bold text-danger">El pago no pudo procesarse</h1>
              <p class="text-muted mb-0">
                Ocurrio un error durante la transaccion.
              </p>
            </div>

            <hr />

            <p class="mb-3">
              Seras redirigido al inicio en
              <span id="counter" class="countdown">10</span>
              segundos.
            </p>

            <a href="index.html" class="btn btn-outline-dark">
              Ir al inicio
            </a>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    let seconds = 10;
    const counter = document.getElementById("counter");

    const interval = setInterval(() => {
      seconds--;
      counter.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "index.html";
      }
    }, 1000);
  </script>

</body>
</html>
