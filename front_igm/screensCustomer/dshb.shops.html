<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Shops | TuEcom</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .shop-card {
            border: none;
            border-radius: 0.75rem;
            position: relative;
            /* crea contexto controlado */
            overflow: visible;
            /* por si algun contenedor lo corta */
        }

        .shop-card:hover {
            /* NO transform, rompe capas */
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
        }

        .dropdown-menu {
            z-index: 2000;
            /* arriba de cards */
        }

        .shop-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .add-shop-btn {
            border-radius: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="#top">TuEcom</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">>
                    <li class="nav-item">
                        <a class="nav-link active" href="/account.html">Account</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 90px; padding-bottom: 60px;">

        <!-- Header -->
        <div class="mb-4">
            <h1 class="h4 fw-semibold mb-1">My shops</h1>
            <p class="text-muted small mb-0">Manage your ecommerce projects</p>
        </div>

        <!-- Shops list -->
        <div class="d-flex flex-column gap-3">

            <!-- Shop 1 -->
            <div class="card shop-card shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <div class="shop-name">Urban Sneakers</div>
                        <span class="badge bg-primary-subtle text-primary mt-1">Standard plan</span>
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-sm btn-light border" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            &#8942;
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Change name</a></li>
                            <li><a class="dropdown-item text-danger" href="#">Delete</a></li>
                            <li><a class="dropdown-item" href="#">Suscription</a></li>
                            <li><a class="dropdown-item" href="dshb.manage.html">Manage</a></li>
                        </ul>
                    </div>

                </div>
            </div>

            <!-- Shop 2 -->
            <div class="card shop-card shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <div class="shop-name">Minimal Home Store</div>
                        <span class="badge bg-secondary-subtle text-secondary mt-1">Free plan</span>
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-sm btn-light border" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            &#8942;
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Change name</a></li>
                            <li><a class="dropdown-item text-danger" href="#">Delete</a></li>
                            <li><a class="dropdown-item" href="#">Suscription</a></li>
                            <li><a class="dropdown-item" href="#">Manage</a></li>
                        </ul>
                    </div>

                </div>
            </div>

        </div>

        <!-- Add shop button -->
        <div class="mt-4">
            <!-- <button class="btn btn-dark w-100 add-shop-btn py-2">
                + Add shop
            </button>-->
            <a class="btn btn-dark w-100 add-shop-btn py-2" href="subcription.html">
                + Add shop
            </a>
        </div>

    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
