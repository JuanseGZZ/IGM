<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #modal-overlay.open { display: flex; }
        .check-scroll { max-height: 160px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 820px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">Product Manager</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" data-action="db-bring">Bring</button>
            <button class="btn btn-success btn-sm" data-action="db-save">Save</button>
        </div>
    </div>
    <ul class="nav nav-tabs mb-4" id="tabs"></ul>
    <div id="content"></div>
</div>

<div id="modal-overlay">
    <div id="modal-box" class="bg-white rounded-3 p-4 shadow" style="width:100%; max-width:480px; max-height:90vh; overflow-y:auto;">
        <div id="modal-body"></div>
    </div>
</div>

<script src="models.js"></script>
<script src="service.js"></script>
<script src="api.js"></script>
<script src="render.js"></script>
<script src="event.js"></script>
</body>
</html>
