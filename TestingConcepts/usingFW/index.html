<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGM — Dashboard de Catálogo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:               #f5f6fa;
      --surface:          #ffffff;
      --sidebar-bg:       #1e2130;
      --sidebar-text:     #8892aa;
      --sidebar-active-bg:#2e3756;
      --primary:          #4f7ef8;
      --danger:           #e05252;
      --warning:          #e09020;
      --success:          #3faa78;
      --text:             #1f2333;
      --text-muted:       #6b7280;
      --border:           #e2e5f0;
      --radius:           8px;
      --header-h:         54px;
      --sidebar-w:        188px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--sidebar-bg);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid #111827;
    }
    .header-brand { font-size: 17px; font-weight: 700; color: #fff; }
    .header-brand span { color: var(--primary); }
    .header-spacer { flex: 1; }
    .header-url { display: flex; align-items: center; gap: 8px; }
    .header-url label { color: var(--sidebar-text); font-size: 12px; }
    .header-url input {
      background: #2a3050; border: 1px solid #3a4060; color: #e0e4f0;
      padding: 5px 10px; border-radius: 6px; font-size: 13px; width: 230px;
    }
    .header-url input:focus { outline: none; border-color: var(--primary); }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    .app { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ────────────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 14px 8px;
      gap: 3px;
      flex-shrink: 0;
      border-right: 1px solid #111827;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #4a5270;
      padding: 12px 10px 4px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: none;
      background: none;
      color: var(--sidebar-text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      width: 100%;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: #253050; color: #c0c8e0; }
    .nav-btn.active { background: var(--sidebar-active-bg); color: #ffffff; }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; }

    /* ── Content ────────────────────────────────────────────────────────────── */
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* ── Section header ─────────────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title { font-size: 19px; font-weight: 600; }
    .section-actions { display: flex; gap: 8px; }

    /* ── Buttons ────────────────────────────────────────────────────────────── */
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.83; }
    .btn:active { transform: scale(0.97); }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--danger  { background: var(--danger);  color: #fff; }
    .btn--warning { background: var(--warning); color: #fff; }
    .btn--success { background: var(--success); color: #fff; }
    .btn--ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn--sm { padding: 4px 10px; font-size: 12px; }

    /* ── Cards ──────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .card-subtitle { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
    .card-actions { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; align-items: flex-start; }
    .card-body { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }

    /* ── Tags ───────────────────────────────────────────────────────────────── */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
    }
    .tag--blue   { background: #dbeafe; color: #1d4ed8; }
    .tag--green  { background: #d1fae5; color: #065f46; }
    .tag--orange { background: #ffedd5; color: #9a3412; }
    .tag--gray   { background: #f3f4f6; color: #374151; }
    .tag--purple { background: #ede9fe; color: #5b21b6; }

    /* ── Tree ───────────────────────────────────────────────────────────────── */
    .tree { font-size: 13px; }
    .tree details { margin: 1px 0; }
    .tree summary {
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
      user-select: none;
    }
    .tree summary:hover { background: var(--border); }
    .tree summary::-webkit-details-marker { display: none; }
    .tree-chevron {
      font-size: 9px;
      color: var(--text-muted);
      transition: transform 0.18s;
      width: 10px;
      text-align: center;
    }
    details[open] > summary .tree-chevron { transform: rotate(90deg); }
    .tree-icon { font-size: 15px; }
    .tree-name { font-weight: 500; }
    .tree-meta { color: var(--text-muted); font-size: 11px; margin-left: auto; }
    .tree-children {
      margin-left: 22px;
      border-left: 2px solid var(--border);
      padding-left: 10px;
    }
    .tree-leaf {
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .tree-leaf:hover { background: var(--border); color: var(--text); }
    .tree-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 6px 10px 2px;
    }
    .variant-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .variant-row:hover { background: var(--border); }
    .impl-key { color: var(--text-muted); }
    .impl-val { font-weight: 600; }

    /* ── Empty / Loading ─────────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-icon  { font-size: 38px; margin-bottom: 12px; }
    .loading     { display: flex; align-items: center; gap: 10px; color: var(--text-muted); padding: 20px; }

    /* ── Modal ───────────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 540px;
      max-width: calc(100vw - 40px);
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.32);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 20px; }

    /* ── IGM framework form overrides ─────────────────────────────────────────── */
    .igm-form { display: flex; flex-direction: column; gap: 0; }
    .igm-field-row, .igm-attr-row, .igm-variant-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .igm-field-row:last-of-type { border-bottom: none; }
    .igm-product-section {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .igm-label    { font-weight: 500; font-size: 13px; }
    .igm-title    { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .igm-hint     { font-size: 12px; color: var(--text-muted); }
    .igm-input, .igm-select, .igm-textarea {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }
    .igm-input:focus, .igm-select:focus, .igm-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }
    .igm-textarea { min-height: 80px; resize: vertical; }
    .igm-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }
    .igm-btn--primary { background: var(--primary); color: #fff; }
    .igm-btn--danger  { background: var(--danger);  color: #fff; }
    .igm-btn--warning { background: var(--warning); color: #fff; }
    .igm-decision { display: flex; flex-direction: column; gap: 12px; }
    .igm-impact-list { padding-left: 20px; margin-top: 4px; }
    .igm-impact-item { padding: 2px 0; color: var(--text-muted); font-size: 13px; }

    /* ── Attribute chips ─────────────────────────────────────────────────────── */
    .attr-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .attr-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 12px;
    }
    .attr-chip-remove {
      cursor: pointer;
      color: var(--danger);
      background: none;
      border: none;
      font-size: 13px;
      padding: 0;
      line-height: 1;
    }
    .attr-chip-remove:hover { opacity: 0.7; }

    /* ── Variants mini-table ─────────────────────────────────────────────────── */
    .variants-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .variants-table th {
      text-align: left;
      padding: 4px 8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .variants-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .variants-table tr:last-child td { border-bottom: none; }
    .variants-table tr:hover td { background: var(--bg); }

    /* ── Status bar ──────────────────────────────────────────────────────────── */
    .status-bar {
      height: 26px;
      background: var(--sidebar-bg);
      border-top: 1px solid #111827;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      font-size: 11px;
      color: var(--sidebar-text);
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .status-dot.error { background: var(--danger); }

    /* ── Toasts ──────────────────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      font-size: 13px;
      min-width: 220px;
      max-width: 340px;
      animation: toast-in 0.22s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      pointer-events: auto;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error   { border-left: 4px solid var(--danger); }
    .toast.info    { border-left: 4px solid var(--primary); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Attr picker inside modal ────────────────────────────────────────────── */
    .attr-picker { display: flex; flex-direction: column; gap: 10px; }
    .attr-picker .igm-hint { margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="header-brand">IGM <span>Dashboard</span></div>
    <div class="header-spacer"></div>
    <div class="header-url">
      <label>API URL</label>
      <input id="base-url" type="text" value="http://localhost:8000">
      <button class="btn btn--primary btn--sm" id="btn-set-url">Aplicar</button>
    </div>
  </header>

  <!-- ── App ────────────────────────────────────────────────────────────── -->
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-section-label">Vista</div>
      <button class="nav-btn active" data-tab="tree">
        <span class="nav-icon">🌳</span> Árbol
      </button>
      <div class="sidebar-section-label">Gestión</div>
      <button class="nav-btn" data-tab="attributes">
        <span class="nav-icon">🏷</span> Atributos
      </button>
      <button class="nav-btn" data-tab="categories">
        <span class="nav-icon">📂</span> Categorías
      </button>
      <button class="nav-btn" data-tab="products">
        <span class="nav-icon">📦</span> Productos
      </button>
    </nav>

    <!-- Content area -->
    <main class="content">

      <!-- ── ÁRBOL ─────────────────────────────────────────────────────── -->
      <section id="tab-tree" class="tab active">
        <div class="section-header">
          <h2 class="section-title">Árbol del catálogo</h2>
          <div class="section-actions">
            <button class="btn btn--ghost" id="btn-refresh-tree">⟳ Actualizar</button>
          </div>
        </div>
        <div id="tree-content">
          <div class="loading">Cargando árbol...</div>
        </div>
      </section>

      <!-- ── ATRIBUTOS ──────────────────────────────────────────────────── -->
      <section id="tab-attributes" class="tab">
        <div class="section-header">
          <h2 class="section-title">Atributos</h2>
          <div class="section-actions">
            <button class="btn btn--ghost" id="btn-refresh-attrs">⟳</button>
            <button class="btn btn--primary" id="btn-new-attr">+ Nuevo atributo</button>
          </div>
        </div>
        <div id="attrs-content">
          <div class="loading">Cargando...</div>
        </div>
      </section>

      <!-- ── CATEGORÍAS ─────────────────────────────────────────────────── -->
      <section id="tab-categories" class="tab">
        <div class="section-header">
          <h2 class="section-title">Categorías</h2>
          <div class="section-actions">
            <button class="btn btn--ghost" id="btn-refresh-cats">⟳</button>
            <button class="btn btn--primary" id="btn-new-cat">+ Nueva categoría</button>
          </div>
        </div>
        <div id="cats-content">
          <div class="loading">Cargando...</div>
        </div>
      </section>

      <!-- ── PRODUCTOS ──────────────────────────────────────────────────── -->
      <section id="tab-products" class="tab">
        <div class="section-header">
          <h2 class="section-title">Productos</h2>
          <div class="section-actions">
            <button class="btn btn--ghost" id="btn-refresh-prods">⟳</button>
            <button class="btn btn--primary" id="btn-new-prod">+ Nuevo producto</button>
          </div>
        </div>
        <div id="prods-content">
          <div class="loading">Cargando...</div>
        </div>
      </section>

    </main>
  </div>

  <!-- ── Status bar ─────────────────────────────────────────────────────── -->
  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Conectando…</span>
  </div>

  <!-- ── Modal ──────────────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Formulario</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ── Toasts ─────────────────────────────────────────────────────────── -->
  <div id="toast-container"></div>

  <script type="module">
    import {
      Config,
      CategoryService,
      ProductService,
      AttributeService,
      buildGenericForm,
    } from "../frontFW/index.js";

    // ── Helpers ──────────────────────────────────────────────────────────────

    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toast(msg, type = "success") {
      const icons = { success: "✓", error: "✕", info: "ℹ" };
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${escHtml(msg)}</span>`;
      document.getElementById("toast-container").appendChild(t);
      setTimeout(() => t.remove(), 4500);
    }

    function setStatus(ok, text) {
      document.getElementById("status-dot").className = "status-dot" + (ok ? "" : " error");
      document.getElementById("status-text").textContent = text;
    }

    // ── Modal ─────────────────────────────────────────────────────────────────

    const overlay   = document.getElementById("modal-overlay");
    const modalTitleEl = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    function openModal(title, renderFn) {
      modalTitleEl.textContent = title;
      modalBody.innerHTML = "";
      renderFn(modalBody);
      overlay.classList.remove("hidden");
    }

    function closeModal() {
      overlay.classList.add("hidden");
      modalBody.innerHTML = "";
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

    // ── Navigation ────────────────────────────────────────────────────────────

    const loaders = {
      tree:       loadTree,
      attributes: loadAttrs,
      categories: loadCats,
      products:   loadProds,
    };

    document.querySelectorAll(".nav-btn[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.getElementById(`tab-${tab}`).classList.add("active");
        loaders[tab]?.();
      });
    });

    document.getElementById("btn-refresh-tree").addEventListener("click", loadTree);
    document.getElementById("btn-refresh-attrs").addEventListener("click", loadAttrs);
    document.getElementById("btn-refresh-cats").addEventListener("click", loadCats);
    document.getElementById("btn-refresh-prods").addEventListener("click", loadProds);

    document.getElementById("btn-set-url").addEventListener("click", () => {
      Config.BASE_URL = document.getElementById("base-url").value.trim();
      allAttrs = []; allCats = []; allProds = [];
      toast("URL actualizada: " + Config.BASE_URL, "info");
      loadTree();
    });

    // ═════════════════════════════════════════════════════════════════════════
    // ÁRBOL
    // ═════════════════════════════════════════════════════════════════════════

    async function loadTree() {
      const container = document.getElementById("tree-content");
      container.innerHTML = '<div class="loading">Cargando árbol…</div>';
      try {
        const [cats, prods] = await Promise.all([
          CategoryService.getAll(),
          ProductService.getAll(),
        ]);
        setStatus(true, `${cats.length} categorías · ${prods.length} productos cargados`);
        renderTree(container, cats, prods);
      } catch (e) {
        setStatus(false, "Error de conexión con la API");
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <p>No se pudo conectar con la API.<br>
            <small style="color:var(--danger)">${escHtml(e.message)}</small></p>
          </div>`;
      }
    }

    function renderTree(container, cats, prods) {
      if (cats.length === 0 && prods.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🌱</div>
            <p>El catálogo está vacío.<br>Creá categorías y productos desde las secciones de gestión.</p>
          </div>`;
        return;
      }

      // Agrupar productos por categoría
      const byCat = {};
      const orphans = [];
      for (const p of prods) {
        const catId = p.category?.id;
        if (catId != null) {
          (byCat[catId] = byCat[catId] || []).push(p);
        } else {
          orphans.push(p);
        }
      }

      const tree = document.createElement("div");
      tree.className = "tree";

      // Nodo por categoría
      for (const cat of cats) {
        const catNode = document.createElement("details");
        catNode.open = true;

        const summary = document.createElement("summary");
        summary.innerHTML = `
          <span class="tree-chevron">▶</span>
          <span class="tree-icon">📂</span>
          <span class="tree-name">${escHtml(cat.name)}</span>
          <span class="tree-meta">id:${cat.id} · ${(byCat[cat.id]||[]).length} producto${(byCat[cat.id]||[]).length !== 1 ? "s" : ""}</span>
        `;
        catNode.appendChild(summary);

        const children = document.createElement("div");
        children.className = "tree-children";

        // Atributos de la categoría
        if (cat.attributes?.length > 0) {
          const lbl = document.createElement("div");
          lbl.className = "tree-section-label";
          lbl.textContent = "Atributos";
          children.appendChild(lbl);

          for (const attr of cat.attributes) {
            const leaf = document.createElement("div");
            leaf.className = "tree-leaf";
            const kind = attr.is_static
              ? `<span class="tag tag--orange" style="font-size:10px">estático</span>`
              : `<span class="tag tag--blue"   style="font-size:10px">dinámico</span>`;
            const enumInfo = attr.data_type === "enum" && attr.enum_values?.length
              ? ` <span class="tree-meta">[${attr.enum_values.join(", ")}]</span>`
              : "";
            leaf.innerHTML = `🏷 <span style="font-weight:500">${escHtml(attr.key)}</span> — ${escHtml(attr.name)} <span class="tag tag--gray" style="font-size:10px">${attr.data_type}</span> ${kind}${enumInfo}`;
            children.appendChild(leaf);
          }
        }

        // Productos de la categoría
        const catProds = byCat[cat.id] || [];
        if (catProds.length > 0) {
          const lbl = document.createElement("div");
          lbl.className = "tree-section-label";
          lbl.textContent = `Productos (${catProds.length})`;
          children.appendChild(lbl);

          for (const prod of catProds) {
            children.appendChild(buildProductNode(prod));
          }
        } else {
          const leaf = document.createElement("div");
          leaf.className = "tree-leaf";
          leaf.textContent = "— Sin productos asignados";
          children.appendChild(leaf);
        }

        catNode.appendChild(children);
        tree.appendChild(catNode);
      }

      // Productos sin categoría
      if (orphans.length > 0) {
        const uncatNode = document.createElement("details");
        uncatNode.open = true;
        uncatNode.innerHTML = `
          <summary>
            <span class="tree-chevron">▶</span>
            <span class="tree-icon">📁</span>
            <span class="tree-name" style="color:var(--text-muted)">Sin categoría</span>
            <span class="tree-meta">${orphans.length} producto${orphans.length !== 1 ? "s" : ""}</span>
          </summary>
        `;
        const uc = document.createElement("div");
        uc.className = "tree-children";
        for (const p of orphans) uc.appendChild(buildProductNode(p));
        uncatNode.appendChild(uc);
        tree.appendChild(uncatNode);
      }

      container.innerHTML = "";
      container.appendChild(tree);
    }

    function buildProductNode(prod) {
      const details = document.createElement("details");

      const summary = document.createElement("summary");
      const price = prod.price != null ? `$${Number(prod.price).toLocaleString("es-AR")}` : "";
      summary.innerHTML = `
        <span class="tree-chevron">▶</span>
        <span class="tree-icon">📦</span>
        <span class="tree-name">${escHtml(prod.code)}</span>
        <span style="font-size:12px;color:var(--text-muted);margin-left:4px">${escHtml(prod.title || "")}</span>
        <span class="tree-meta">${price}</span>
      `;
      details.appendChild(summary);

      const children = document.createElement("div");
      children.className = "tree-children";

      // Implementaciones estáticas del producto
      const impls = prod.attributes_implementations || [];
      if (impls.length > 0) {
        const lbl = document.createElement("div");
        lbl.className = "tree-section-label";
        lbl.textContent = "Atributos estáticos";
        children.appendChild(lbl);

        for (const impl of impls) {
          const leaf = document.createElement("div");
          leaf.className = "tree-leaf";
          leaf.innerHTML = `<span class="impl-key">${escHtml(impl.attribute?.key || "?")}</span>&nbsp;=&nbsp;<span class="impl-val">${escHtml(String(impl.value ?? ""))}</span>`;
          children.appendChild(leaf);
        }
      }

      // Variantes
      const variants = prod.variants || [];
      if (variants.length > 0) {
        const lbl = document.createElement("div");
        lbl.className = "tree-section-label";
        lbl.textContent = `Variantes (${variants.length})`;
        children.appendChild(lbl);

        for (const v of variants) {
          const row = document.createElement("div");
          row.className = "variant-row";

          const implsStr = (v.attribute_implementations || [])
            .map(i => `<span><span class="impl-key">${escHtml(i.attribute?.key || "?")}</span>=<span class="impl-val">${escHtml(String(i.value ?? ""))}</span></span>`)
            .join(" · ") || `<span style="color:var(--text-muted)">sin atributos</span>`;

          row.innerHTML = `🎨 <span style="color:var(--text-muted);font-size:11px">#${v.id}</span> ${implsStr}`;
          children.appendChild(row);
        }
      } else {
        const leaf = document.createElement("div");
        leaf.className = "tree-leaf";
        leaf.textContent = "— Sin variantes";
        children.appendChild(leaf);
      }

      details.appendChild(children);
      return details;
    }

    // ═════════════════════════════════════════════════════════════════════════
    // ATRIBUTOS
    // ═════════════════════════════════════════════════════════════════════════

    let allAttrs = [];

    async function loadAttrs() {
      const container = document.getElementById("attrs-content");
      container.innerHTML = '<div class="loading">Cargando…</div>';
      try {
        allAttrs = await AttributeService.getAll();
        renderAttrs(container, allAttrs);
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><p>Error: ${escHtml(e.message)}</p></div>`;
      }
    }

    function renderAttrs(container, attrs) {
      if (attrs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏷</div>
            <p>No hay atributos. Creá el primero.</p>
          </div>`;
        return;
      }

      container.innerHTML = "";
      for (const attr of attrs) {
        const card = document.createElement("div");
        card.className = "card";

        const kindTag   = attr.is_static
          ? `<span class="tag tag--orange">estático</span>`
          : `<span class="tag tag--blue">dinámico</span>`;
        const dtypeTag  = `<span class="tag tag--gray">${attr.data_type}</span>`;
        const enumInfo  = attr.data_type === "enum" && attr.enum_values?.length
          ? `<span style="font-size:11px;color:var(--text-muted)">[${attr.enum_values.join(", ")}]</span>`
          : "";

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">
                ${escHtml(attr.name)}
                <code style="font-size:11px;color:var(--text-muted);font-weight:400">${escHtml(attr.key)}</code>
              </div>
              <div class="card-subtitle" style="display:flex;gap:5px;align-items:center;margin-top:4px">
                ${dtypeTag} ${kindTag} ${enumInfo}
              </div>
            </div>
            <div class="card-actions">
              ${attr.data_type === "enum" ? `<button class="btn btn--ghost btn--sm" data-id="${attr.id}" data-action="add-enum">+ Enum</button>` : ""}
              <button class="btn btn--ghost btn--sm" data-id="${attr.id}" data-action="edit-attr">Editar</button>
              <button class="btn btn--danger btn--sm" data-id="${attr.id}" data-action="delete-attr">Eliminar</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      }

      container.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () =>
          handleAttrAction(btn.dataset.action, parseInt(btn.dataset.id))
        );
      });
    }

    async function handleAttrAction(action, attrId) {
      const attr = allAttrs.find(a => a.id === attrId);
      if (!attr) return;

      if (action === "edit-attr") {
        openModal(`Editar: ${attr.name}`, body => {
          const schema = {
            name: { label: "Nombre legible", type: "text", required: true },
          };
          if (attr.data_type === "enum") {
            schema.enum_values = {
              label: "Valores enum (separados por coma)",
              type: "text",
              placeholder: "rojo, azul, verde",
            };
          }
          const defaults = {
            name: attr.name,
            enum_values: (attr.enum_values || []).join(", "),
          };
          buildGenericForm(body, schema, defaults, async data => {
            const payload = { name: data.name.trim() };
            if (attr.data_type === "enum") {
              payload.enum_values = data.enum_values
                .split(",").map(v => v.trim()).filter(Boolean);
            }
            try {
              await AttributeService.update(attrId, payload);
              toast("Atributo actualizado");
              closeModal();
              loadAttrs();
            } catch (e) { toast(e.message, "error"); }
          });
        });

      } else if (action === "add-enum") {
        openModal(`Agregar valor enum — ${attr.name}`, body => {
          buildGenericForm(body,
            { value: { label: "Nuevo valor enum", type: "text", required: true } },
            {},
            async data => {
              try {
                await AttributeService.addEnumValue(attrId, data.value.trim());
                toast("Valor enum agregado");
                closeModal();
                loadAttrs();
              } catch (e) { toast(e.message, "error"); }
            }
          );
        });

      } else if (action === "delete-attr") {
        if (!confirm(`¿Eliminar el atributo "${attr.name}" (${attr.key})?`)) return;
        try {
          await AttributeService.delete(attrId);
          toast("Atributo eliminado");
          loadAttrs();
        } catch (e) { toast(e.message, "error"); }
      }
    }

    document.getElementById("btn-new-attr").addEventListener("click", () => {
      openModal("Nuevo atributo", body => {
        buildGenericForm(body, {
          key:       { label: "Key único", type: "text", required: true, placeholder: "color" },
          name:      { label: "Nombre legible", type: "text", required: true, placeholder: "Color" },
          data_type: {
            label: "Tipo de dato", type: "select", required: true,
            options: [
              { value: "text",    label: "text" },
              { value: "number",  label: "number" },
              { value: "boolean", label: "boolean" },
              { value: "enum",    label: "enum" },
            ],
          },
          is_static: {
            label: "Aplica a", type: "select",
            options: [
              { value: "false", label: "Variante (dinámico)" },
              { value: "true",  label: "Producto (estático)" },
            ],
          },
          enum_values: {
            label: "Valores enum (si corresponde, separados por coma)",
            type: "text",
            placeholder: "rojo, azul, verde",
          },
        }, {}, async data => {
          const payload = {
            key:       data.key.trim(),
            name:      data.name.trim(),
            data_type: data.data_type,
            is_static: data.is_static === "true",
          };
          if (data.data_type === "enum" && data.enum_values) {
            payload.enum_values = data.enum_values
              .split(",").map(v => v.trim()).filter(Boolean);
          }
          try {
            await AttributeService.create(payload);
            toast("Atributo creado");
            closeModal();
            loadAttrs();
          } catch (e) { toast(e.message, "error"); }
        });
      });
    });

    // ═════════════════════════════════════════════════════════════════════════
    // CATEGORÍAS
    // ═════════════════════════════════════════════════════════════════════════

    let allCats = [];

    async function loadCats() {
      const container = document.getElementById("cats-content");
      container.innerHTML = '<div class="loading">Cargando…</div>';
      try {
        if (allAttrs.length === 0) allAttrs = await AttributeService.getAll();
        allCats = await CategoryService.getAll();
        renderCats(container, allCats);
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><p>Error: ${escHtml(e.message)}</p></div>`;
      }
    }

    function renderCats(container, cats) {
      if (cats.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <p>No hay categorías. Creá la primera.</p>
          </div>`;
        return;
      }

      container.innerHTML = "";
      for (const cat of cats) {
        const card = document.createElement("div");
        card.className = "card";

        const attrChips = (cat.attributes || []).map(a => `
          <span class="attr-chip">
            <span class="tag tag--${a.is_static ? "orange" : "blue"}" style="font-size:10px">${a.is_static ? "S" : "D"}</span>
            ${escHtml(a.key)}
            <button class="attr-chip-remove"
              data-action="remove-attr"
              data-cat-id="${cat.id}"
              data-attr-id="${a.id}"
              title="Quitar atributo">✕</button>
          </span>
        `).join("");

        const prodCount = (cat.products || []).length;

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${escHtml(cat.name)}</div>
              <div class="card-subtitle">id: ${cat.id} · ${prodCount} producto${prodCount !== 1 ? "s" : ""}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn--ghost btn--sm" data-action="rename-cat" data-cat-id="${cat.id}">Renombrar</button>
              <button class="btn btn--ghost btn--sm" data-action="add-dynamic" data-cat-id="${cat.id}">+ Attr dinámico</button>
              <button class="btn btn--ghost btn--sm" data-action="add-static"  data-cat-id="${cat.id}">+ Attr estático</button>
              <button class="btn btn--danger btn--sm" data-action="delete-cat" data-cat-id="${cat.id}">Eliminar</button>
            </div>
          </div>
          ${cat.attributes?.length > 0 ? `
            <div class="card-body">
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Atributos asignados</div>
              <div class="attr-list">${attrChips}</div>
            </div>
          ` : ""}
        `;
        container.appendChild(card);
      }

      container.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () =>
          handleCatAction(
            btn.dataset.action,
            parseInt(btn.dataset.catId),
            btn.dataset.attrId ? parseInt(btn.dataset.attrId) : null
          )
        );
      });
    }

    async function handleCatAction(action, catId, attrId) {
      const cat = allCats.find(c => c.id === catId);
      if (!cat) return;

      if (action === "rename-cat") {
        openModal(`Renombrar: ${cat.name}`, body => {
          buildGenericForm(body,
            { name: { label: "Nuevo nombre", type: "text", required: true } },
            { name: cat.name },
            async data => {
              try {
                await CategoryService.updateName(catId, data.name.trim());
                toast("Categoría renombrada");
                closeModal();
                loadCats();
              } catch (e) { toast(e.message, "error"); }
            }
          );
        });

      } else if (action === "add-dynamic") {
        openModal(`Agregar atributo dinámico — ${cat.name}`, body => {
          const opts = allAttrs.filter(a => !a.is_static);
          if (opts.length === 0) {
            body.innerHTML = '<p class="igm-hint" style="padding:10px">No hay atributos dinámicos disponibles. Creá uno en la sección Atributos.</p>';
            return;
          }
          renderAttrPicker(body, opts, async selectedId => {
            body.innerHTML = '<div class="loading">Procesando…</div>';
            try {
              await CategoryService.addDynamicAttribute(catId, selectedId, body);
              toast("Atributo dinámico agregado a la categoría");
              closeModal();
              loadCats();
            } catch (e) { toast(e.message, "error"); }
          });
        });

      } else if (action === "add-static") {
        openModal(`Agregar atributo estático — ${cat.name}`, body => {
          const opts = allAttrs.filter(a => a.is_static);
          if (opts.length === 0) {
            body.innerHTML = '<p class="igm-hint" style="padding:10px">No hay atributos estáticos disponibles. Creá uno en la sección Atributos.</p>';
            return;
          }
          renderAttrPicker(body, opts, async selectedId => {
            body.innerHTML = '<div class="loading">Procesando…</div>';
            try {
              await CategoryService.addStaticAttribute(catId, selectedId, body);
              toast("Atributo estático agregado a la categoría");
              closeModal();
              loadCats();
            } catch (e) { toast(e.message, "error"); }
          });
        });

      } else if (action === "remove-attr") {
        if (!confirm("¿Quitar este atributo de la categoría?")) return;
        openModal("Quitando atributo…", body => {
          body.innerHTML = '<div class="loading">Procesando…</div>';
          CategoryService.removeAttribute(catId, attrId, body)
            .then(() => { toast("Atributo quitado"); closeModal(); loadCats(); })
            .catch(e => toast(e.message, "error"));
        });

      } else if (action === "delete-cat") {
        if (!confirm(`¿Eliminar la categoría "${cat.name}"?\nSolo es posible si no tiene productos asociados.`)) return;
        try {
          await CategoryService.delete(catId);
          toast("Categoría eliminada");
          loadCats();
        } catch (e) { toast(e.message, "error"); }
      }
    }

    /** Renderiza un picker de atributos + botón Confirmar */
    function renderAttrPicker(body, attrs, onPick) {
      const wrap = document.createElement("div");
      wrap.className = "attr-picker";

      const hint = document.createElement("p");
      hint.className = "igm-hint";
      hint.textContent = "Seleccioná el atributo a agregar:";
      wrap.appendChild(hint);

      const sel = document.createElement("select");
      sel.className = "igm-select";
      for (const a of attrs) {
        const o = document.createElement("option");
        o.value = a.id;
        o.textContent = `${a.name} (${a.key}) — ${a.data_type}`;
        sel.appendChild(o);
      }
      wrap.appendChild(sel);

      const btn = document.createElement("button");
      btn.className = "igm-btn igm-btn--primary";
      btn.textContent = "Confirmar";
      btn.addEventListener("click", () => onPick(parseInt(sel.value)));
      wrap.appendChild(btn);

      body.appendChild(wrap);
    }

    document.getElementById("btn-new-cat").addEventListener("click", () => {
      openModal("Nueva categoría", body => {
        buildGenericForm(body,
          { name: { label: "Nombre", type: "text", required: true, placeholder: "Ropa" } },
          {},
          async data => {
            try {
              await CategoryService.create(data.name.trim());
              toast("Categoría creada");
              closeModal();
              loadCats();
            } catch (e) { toast(e.message, "error"); }
          }
        );
      });
    });

    // ═════════════════════════════════════════════════════════════════════════
    // PRODUCTOS
    // ═════════════════════════════════════════════════════════════════════════

    let allProds = [];

    async function loadProds() {
      const container = document.getElementById("prods-content");
      container.innerHTML = '<div class="loading">Cargando…</div>';
      try {
        if (allCats.length === 0)  allCats  = await CategoryService.getAll();
        if (allAttrs.length === 0) allAttrs = await AttributeService.getAll();
        allProds = await ProductService.getAll();
        renderProds(container, allProds);
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><p>Error: ${escHtml(e.message)}</p></div>`;
      }
    }

    function renderProds(container, prods) {
      if (prods.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📦</div>
            <p>No hay productos. Creá el primero.</p>
          </div>`;
        return;
      }

      container.innerHTML = "";
      for (const prod of prods) {
        const card = document.createElement("div");
        card.className = "card";

        // ── Tabla de variantes
        let variantsHtml = "";
        const variants = prod.variants || [];
        if (variants.length > 0) {
          const keys = [...new Set(
            variants.flatMap(v =>
              (v.attribute_implementations || []).map(i => i.attribute?.key)
            )
          )].filter(Boolean);

          const rows = variants.map(v => {
            const cells = keys.map(k => {
              const impl = (v.attribute_implementations || [])
                .find(i => i.attribute?.key === k);
              return `<td>${escHtml(String(impl?.value ?? "—"))}</td>`;
            }).join("");
            return `<tr>
              <td style="color:var(--text-muted)">#${v.id}</td>
              ${cells}
              <td>
                <button class="btn btn--danger btn--sm"
                  data-action="delete-variant"
                  data-prod-id="${prod.id}"
                  data-variant-id="${v.id}">✕</button>
              </td>
            </tr>`;
          }).join("");

          variantsHtml = `
            <div style="margin-top:12px">
              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">
                Variantes (${variants.length})
              </div>
              <table class="variants-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    ${keys.map(k => `<th>${escHtml(k)}</th>`).join("")}
                    <th></th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;
        }

        // ── Implementaciones estáticas
        const impls = prod.attributes_implementations || [];
        const implsHtml = impls.length > 0
          ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
               ${impls.map(i => `
                 <span class="attr-chip">
                   <span class="impl-key">${escHtml(i.attribute?.key || "?")}</span>
                   =
                   <span class="impl-val">${escHtml(String(i.value ?? ""))}</span>
                 </span>`).join("")}
             </div>`
          : "";

        const hasBody = implsHtml || variantsHtml;

        card.innerHTML = `
          <div class="card-header">
            <div style="min-width:0">
              <div class="card-title">
                <span class="tag tag--gray">${escHtml(prod.code)}</span>
                ${escHtml(prod.title || "")}
              </div>
              <div class="card-subtitle">
                id:${prod.id}
                ${prod.price != null ? ` · $${Number(prod.price).toLocaleString("es-AR")}` : ""}
                ${prod.brand ? ` · ${escHtml(prod.brand)}` : ""}
                · 📂 ${escHtml(prod.category?.name || "Sin categoría")}
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn--ghost btn--sm"   data-action="edit-prod"     data-prod-id="${prod.id}">Editar</button>
              <button class="btn btn--ghost btn--sm"   data-action="change-cat"    data-prod-id="${prod.id}">📂 Categoría</button>
              <button class="btn btn--ghost btn--sm"   data-action="add-impl"      data-prod-id="${prod.id}">+ Impl.</button>
              <button class="btn btn--ghost btn--sm"   data-action="add-dyn-attr"  data-prod-id="${prod.id}">+ Attr din.</button>
              <button class="btn btn--success btn--sm" data-action="new-variant"   data-prod-id="${prod.id}">+ Variante</button>
              <button class="btn btn--danger btn--sm"  data-action="delete-prod"   data-prod-id="${prod.id}">Eliminar</button>
            </div>
          </div>
          ${hasBody ? `<div class="card-body">${implsHtml}${variantsHtml}</div>` : ""}
        `;
        container.appendChild(card);
      }

      container.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () =>
          handleProdAction(
            btn.dataset.action,
            parseInt(btn.dataset.prodId),
            btn.dataset.variantId ? parseInt(btn.dataset.variantId) : null
          )
        );
      });
    }

    async function handleProdAction(action, prodId, variantId) {
      const prod = allProds.find(p => p.id === prodId);
      if (!prod) return;

      if (action === "edit-prod") {
        openModal(`Editar: ${prod.code}`, body => {
          buildGenericForm(body, {
            title:       { label: "Título",      type: "text" },
            price:       { label: "Precio",      type: "number" },
            description: { label: "Descripción", type: "textarea" },
            brand:       { label: "Marca",       type: "text" },
            category_id: {
              label: "Categoría", type: "select",
              options: allCats.map(c => ({ value: c.id, label: c.name })),
            },
          }, {
            title:       prod.title,
            price:       prod.price,
            description: prod.description,
            brand:       prod.brand,
            category_id: prod.category?.id,
          }, async data => {
            try {
              await ProductService.update(prodId, data);
              toast("Producto actualizado");
              closeModal();
              loadProds();
            } catch (e) { toast(e.message, "error"); }
          });
        });

      } else if (action === "add-impl") {
        openModal(`Agregar implementación — ${prod.code}`, body => {
          const staticAttrs = allAttrs.filter(a => a.is_static);
          if (staticAttrs.length === 0) {
            body.innerHTML = '<p class="igm-hint" style="padding:10px">No hay atributos estáticos disponibles.</p>';
            return;
          }

          const wrap = document.createElement("div");
          wrap.className = "attr-picker";

          const hint = document.createElement("p");
          hint.className = "igm-hint";
          hint.textContent = "Seleccioná el atributo y el valor:";
          wrap.appendChild(hint);

          const sel = document.createElement("select");
          sel.className = "igm-select";
          for (const a of staticAttrs) {
            const o = document.createElement("option");
            o.value = a.id;
            o.textContent = `${a.name} (${a.key}) — ${a.data_type}`;
            sel.appendChild(o);
          }
          wrap.appendChild(sel);

          const valIn = document.createElement("input");
          valIn.type = "text";
          valIn.className = "igm-input";
          valIn.placeholder = "Valor";
          wrap.appendChild(valIn);

          const btn = document.createElement("button");
          btn.className = "igm-btn igm-btn--primary";
          btn.textContent = "Agregar implementación";
          btn.addEventListener("click", async () => {
            try {
              await ProductService.addImplementation(prodId, parseInt(sel.value), valIn.value.trim());
              toast("Implementación agregada");
              closeModal();
              loadProds();
            } catch (e) { toast(e.message, "error"); }
          });
          wrap.appendChild(btn);

          body.appendChild(wrap);
        });

      } else if (action === "add-dyn-attr") {
        openModal(`Agregar atributo dinámico — ${prod.code}`, body => {
          const dynAttrs = allAttrs.filter(a => !a.is_static);
          if (dynAttrs.length === 0) {
            body.innerHTML = '<p class="igm-hint" style="padding:10px">No hay atributos dinámicos disponibles.</p>';
            return;
          }
          renderAttrPicker(body, dynAttrs, async selectedId => {
            body.innerHTML = '<div class="loading">Procesando…</div>';
            try {
              await ProductService.addDynamicAttribute(prodId, selectedId, body);
              toast("Atributo dinámico agregado al producto");
              closeModal();
              loadProds();
            } catch (e) { toast(e.message, "error"); }
          });
        });

      } else if (action === "new-variant") {
        openModal(`Nueva variante — ${prod.code}`, body => {
          body.innerHTML = '<div class="loading">Cargando atributos requeridos…</div>';
          ProductService.createVariant(prodId, [], body)
            .then(() => { toast("Variante creada"); closeModal(); loadProds(); })
            .catch(e => toast(e.message, "error"));
        });

      } else if (action === "delete-variant") {
        if (!confirm(`¿Eliminar la variante #${variantId}?`)) return;
        try {
          await ProductService.deleteVariant(prodId, variantId);
          toast("Variante eliminada");
          loadProds();
        } catch (e) { toast(e.message, "error"); }

      } else if (action === "change-cat") {
        openModal(`Cambiar categoría — ${prod.code}`, body => {
          const wrap = document.createElement("div");
          wrap.className = "attr-picker";

          const hint = document.createElement("p");
          hint.className = "igm-hint";
          hint.textContent = `Categoría actual: ${prod.category?.name || "Sin categoría"}`;
          hint.style.marginBottom = "8px";
          wrap.appendChild(hint);

          const sel = document.createElement("select");
          sel.className = "igm-select";
          for (const c of allCats) {
            const o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.name;
            if (c.id === prod.category?.id) o.selected = true;
            sel.appendChild(o);
          }
          wrap.appendChild(sel);

          const btn = document.createElement("button");
          btn.className = "igm-btn igm-btn--primary";
          btn.textContent = "Confirmar";
          btn.addEventListener("click", async () => {
            try {
              await CategoryService.addProduct(parseInt(sel.value), prodId);
              toast("Categoría del producto actualizada");
              closeModal();
              loadProds();
            } catch (e) { toast(e.message, "error"); }
          });
          wrap.appendChild(btn);
          body.appendChild(wrap);
        });

      } else if (action === "delete-prod") {
        if (!confirm(`¿Eliminar el producto "${prod.code}" (${prod.title || ""})?`)) return;
        try {
          await ProductService.delete(prodId);
          toast("Producto eliminado");
          loadProds();
        } catch (e) { toast(e.message, "error"); }
      }
    }

    document.getElementById("btn-new-prod").addEventListener("click", async () => {
      if (allCats.length === 0) allCats = await CategoryService.getAll();
      openModal("Nuevo producto", body => {
        buildGenericForm(body, {
          code:        { label: "Código único",  type: "text",     required: true, placeholder: "REMERA-001" },
          title:       { label: "Título",        type: "text",     required: true },
          price:       { label: "Precio",        type: "number",   required: true },
          description: { label: "Descripción",   type: "textarea" },
          brand:       { label: "Marca",         type: "text" },
          category_id: {
            label: "Categoría", type: "select",
            options: allCats.map(c => ({ value: c.id, label: c.name })),
          },
        }, {}, async data => {
          try {
            await ProductService.create(data);
            toast("Producto creado");
            closeModal();
            loadProds();
          } catch (e) { toast(e.message, "error"); }
        });
      });
    });

    // ═════════════════════════════════════════════════════════════════════════
    // INIT
    // ═════════════════════════════════════════════════════════════════════════

    loadTree();
  </script>
</body>
</html>
