<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }

        .prod-card {
            cursor: pointer;
            border: none !important;
            border-radius: 16px !important;
            transition: transform .18s, box-shadow .18s;
            overflow: hidden;
        }
        .prod-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,.12) !important;
        }
        .prod-photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }
        .prod-photo-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            font-size: 3.5rem;
        }

        .attr-pill {
            cursor: pointer;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: .2rem .7rem;
            font-size: .82rem;
            background: white;
            transition: border-color .12s, background .12s, color .12s;
            user-select: none;
        }
        .attr-pill.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: white;
        }
        .attr-pill:hover:not(.selected) {
            border-color: #a5b4fc;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #modal-overlay.open { display: flex; }
        #modal-box {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 20px;
            background: white;
        }

        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 960px">
    <div class="mb-5">
        <h3 class="fw-bold mb-1">Catálogo</h3>
        <span class="text-muted small" id="subtitle"></span>
    </div>
    <div id="grid" class="row g-4">
        <div class="col-12 text-center text-muted py-5">Cargando...</div>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal-box" class="shadow-lg">
        <div id="modal-body"></div>
    </div>
</div>

<script src="models.js"></script>
<script src="service.js"></script>
<script src="api.js"></script>
<script src="render.js"></script>
<script src="events.js"></script>
</body>
</html>
